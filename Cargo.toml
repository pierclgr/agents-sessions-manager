[package]
name = "agents-sessions"
version = "0.1.0"
edition = "2024"
description = "Browse, resume, and delete coding agent sessions"
repository = "https://github.com/pierclgr/agents-sessions-manager"

[dependencies]
chrono = "0.4"
crossterm = "0.29"
dirs = "6"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
signal-hook = "0.3"
tempfile = "3"

[dev-dependencies]
portable-pty = "0.9"
